<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050">
<rect width="1200" height="1050" fill="#202326"/>
<text x="60" y="65" fill="#f2eee8" font-family="Arial,sans-serif" font-size="31" font-weight="bold">PAIRWISE CLOSED-SEGMENT INTERSECTION</text>
<g font-family="Arial,sans-serif" font-size="22" text-anchor="middle">
<rect x="360" y="110" width="480" height="80" rx="14" fill="#35434b"/><text x="600" y="160" fill="#fff">Compute four orientations</text>
<path d="M600 190 V245" stroke="#d47b59" stroke-width="4"/>
<rect x="360" y="245" width="480" height="90" rx="14" fill="#35434b"/><text x="600" y="280" fill="#fff">All four orientations</text><text x="600" y="310" fill="#fff">equal zero?</text>
<path d="M360 290 H190 V410" fill="none" stroke="#8fc6ad" stroke-width="4"/><text x="230" y="275" fill="#8fc6ad">YES</text>
<rect x="55" y="410" width="270" height="115" rx="14" fill="#36594f"/><text x="190" y="450" fill="#fff">Compare collinear</text><text x="190" y="480" fill="#fff">intervals</text><text x="190" y="510" fill="#fff" font-size="18">none / point / overlap</text>
<path d="M840 290 H1010 V410" fill="none" stroke="#d47b59" stroke-width="4"/><text x="960" y="275" fill="#e2a17e">NO</text>
<rect x="870" y="410" width="270" height="115" rx="14" fill="#5b4438"/><text x="1005" y="450" fill="#fff">Check collinear</text><text x="1005" y="480" fill="#fff">endpoint contacts</text>
<path d="M1005 525 V590" stroke="#d47b59" stroke-width="4"/>
<rect x="830" y="590" width="350" height="100" rx="14" fill="#35434b"/><text x="1005" y="630" fill="#fff">Strict opposite-side</text><text x="1005" y="660" fill="#fff">tests both hold?</text>
<path d="M830 640 H600 V770" fill="none" stroke="#8fc6ad" stroke-width="4"/><text x="720" y="620" fill="#8fc6ad">YES</text>
<rect x="440" y="770" width="320" height="90" rx="14" fill="#36594f"/><text x="600" y="825" fill="#fff">Return crossing point</text>
<path d="M1180 640 H1130 V770" fill="none" stroke="#e2a17e" stroke-width="4"/><text x="1150" y="620" fill="#e2a17e">NO</text>
<rect x="940" y="770" width="220" height="90" rx="14" fill="#5b4438"/><text x="1050" y="825" fill="#fff">No intersection</text>
</g>
<text x="60" y="970" fill="#b8b8b3" font-family="Arial,sans-serif" font-size="18">Teaching contract: integer endpoints, distinct endpoints, Cartesian plane. Zero-length segments are rejected.</text>
</svg>