<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#202326"/>
<text x="60" y="65" fill="#f2eee8" font-family="Arial,sans-serif" font-size="32" font-weight="bold">FIVE RELATIONSHIPS BETWEEN TWO SEGMENTS</text>
<g font-family="Arial,sans-serif" font-size="21" fill="#f2eee8">
<g transform="translate(70 130)"><text x="0" y="0" font-weight="bold">01 · PROPER CROSSING</text><path d="M20 170 L390 30 M20 30 L390 170" stroke="#d47b59" stroke-width="9" stroke-linecap="round"/><circle cx="205" cy="100" r="10" fill="#8fc6ad"/><text x="0" y="220" fill="#b8b8b3">One shared interior point</text></g>
<g transform="translate(730 130)"><text x="0" y="0" font-weight="bold">02 · ENDPOINT CONTACT</text><path d="M20 120 L220 120 M220 120 L390 35" stroke="#d47b59" stroke-width="9" stroke-linecap="round"/><circle cx="220" cy="120" r="10" fill="#8fc6ad"/><text x="0" y="220" fill="#b8b8b3">One shared endpoint</text></g>
<g transform="translate(70 470)"><text x="0" y="0" font-weight="bold">03 · COLLINEAR OVERLAP</text><path d="M20 100 L390 100" stroke="#6f7880" stroke-width="13" stroke-linecap="round"/><path d="M150 100 L330 100" stroke="#d47b59" stroke-width="13" stroke-linecap="round"/><text x="0" y="180" fill="#b8b8b3">Shared interval of positive length</text></g>
<g transform="translate(730 470)"><text x="0" y="0" font-weight="bold">04 · COLLINEAR TOUCH</text><path d="M20 100 L200 100 M200 100 L390 100" stroke="#d47b59" stroke-width="9" stroke-linecap="round"/><circle cx="200" cy="100" r="10" fill="#8fc6ad"/><text x="0" y="180" fill="#b8b8b3">One shared boundary point</text></g>
<g transform="translate(400 760)"><text x="0" y="0" font-weight="bold">05 · DISJOINT</text><path d="M20 50 L160 50 M240 50 L380 50" stroke="#d47b59" stroke-width="9" stroke-linecap="round"/><text x="0" y="80" fill="#b8b8b3">No shared point</text></g>
</g></svg>