name: Diagnose Nairobi R130 cross-processor residuals
on:
  workflow_dispatch:
    inputs:
      opera_run_id:
        description: Successful OPERA RTC asset workflow run ID
        required: true
        default: "45345864969"
        type: string
      process_run_id:
        description: Successful paired-raster and common-support workflow run ID
        required: true
        default: "45352163781"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: diagnose-opera-nairobi-r130-residuals
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install raster diagnostics dependencies
        run: python -m pip install numpy rasterio
      - name: Test residual diagnostics
        run: python -m unittest explorations.radar.test_diagnose_opera_nairobi_r130_residuals -v
      - name: Download OPERA RTC and RTC-STATIC assets
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-opera-rtc-science-assets
          path: opera-assets
          run-id: ${{ inputs.opera_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Sentinel Hub pairs and support QA
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-sentinelhub-paired-gamma0-rasters-and-support-qa
          path: sentinelhub-assets
          run-id: ${{ inputs.process_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate georeferenced residual maps and stratified report
        run: |
          python explorations/radar/diagnose_opera_nairobi_r130_residuals.py \\
            --opera-dir opera-assets \\
            --sentinelhub-dir sentinelhub-assets \\
            --output-dir residual-maps \\
            --report residual-diagnostics.json
      - name: Upload residual diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nairobi-r130-residual-maps-and-diagnostics
          path: |
            residual-maps/
            residual-diagnostics.json
          if-no-files-found: error
          retention-days: 30
