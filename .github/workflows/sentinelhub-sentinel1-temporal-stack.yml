name: Sentinel Hub Sentinel-1 Nairobi temporal stack

on:
  # Keep the expensive provider run explicit, but automatically regenerate the
  # QA artifact whenever the pipeline implementation itself changes on main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/sentinelhub-sentinel1-temporal-stack.yml"
      - "explorations/radar/**"
  workflow_dispatch:
    inputs:
      max_scenes:
        description: Number of chronological catalogue candidates to process (2–4)
        required: true
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: sentinelhub-sentinel1-nairobi-temporal-stack
  cancel-in-progress: false

jobs:
  process-temporal-stack:
    name: Process and quality-check fixed-grid Nairobi acquisitions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install raster QA dependencies
        run: python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt

      - name: Verify Client Credentials OAuth secrets
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID" || { echo "::error::Missing SENTINEL_HUB_CLIENT_ID"; exit 1; }
          test -n "$SENTINEL_HUB_CLIENT_SECRET" || { echo "::error::Missing SENTINEL_HUB_CLIENT_SECRET"; exit 1; }
          echo "Sentinel Hub Client Credentials secrets are configured."

      - name: Process chronological full-coverage candidates on a common grid
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: python explorations/radar/process_sentinelhub_sentinel1_stack.py --max-scenes "${{ inputs.max_scenes || 4 }}" --output-dir data/sentinelhub/nairobi/stack

      - name: Retrieve per-pixel local incidence angle for each acquisition
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: python explorations/radar/process_sentinel1_geometry_aux.py --stack-metadata data/sentinelhub/nairobi/stack/sentinel1_nairobi_temporal_stack.metadata.json --output-dir data/sentinelhub/nairobi/stack/geometry_aux

      - name: Compare local incidence-angle surfaces across dates
        run: |
          set -euo pipefail
          shopt -s nullglob
          angles=(data/sentinelhub/nairobi/stack/geometry_aux/*_local-incidence-angle.tif)
          python explorations/radar/screen_sentinel1_angle_consistency.py --rasters "${angles[@]}" --output data/sentinelhub/nairobi/stack/geometry_aux/sentinel1_nairobi_local_incidence_angle_consistency.json

      - name: Process parallel gamma0 terrain-corrected backscatter and terrain diagnostics
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: python explorations/radar/process_sentinel1_gamma0_terrain.py --stack-metadata data/sentinelhub/nairobi/stack/sentinel1_nairobi_temporal_stack.metadata.json --output-dir data/sentinelhub/nairobi/stack/terrain_aux --dem-instance COPERNICUS_30 --oversampling 2

      - name: Inspect each acquisition and create Nairobi county-masked raster
        run: |
          set -euo pipefail
          shopt -s nullglob
          rasters=(data/sentinelhub/nairobi/stack/*.tif)
          test "${#rasters[@]}" -ge 2
          for raster in "${rasters[@]}"; do
            python explorations/radar/inspect_sentinelhub_sentinel1.py "$raster"
            python explorations/radar/mask_sentinelhub_sentinel1_nairobi_county.py "$raster"
          done

      - name: Screen relative global alignment across acquisition dates
        run: |
          set -euo pipefail
          shopt -s nullglob
          rasters=(data/sentinelhub/nairobi/stack/sentinel1_nairobi_stack_*_vv-vh.tif)
          python explorations/radar/screen_sentinel1_registration.py --rasters "${rasters[@]}" --output data/sentinelhub/nairobi/stack/sentinel1_nairobi_registration_screen.json

      - name: Screen local alignment and radiometric consistency
        run: |
          set -euo pipefail
          shopt -s nullglob
          rasters=(data/sentinelhub/nairobi/stack/sentinel1_nairobi_stack_*_vv-vh.tif)
          python explorations/radar/screen_sentinel1_temporal_qa.py --rasters "${rasters[@]}" --output data/sentinelhub/nairobi/stack/sentinel1_nairobi_temporal_qa_screen.json

      - name: Screen eroded built-up reference areas against ESA WorldCover 2021
        run: |
          set -euo pipefail
          shopt -s nullglob
          rasters=(data/sentinelhub/nairobi/stack/sentinel1_nairobi_stack_*_vv-vh.tif)
          boundaries=(data/sentinelhub/nairobi/stack/nairobi_county_boundary_*.geojson)
          test "${#boundaries[@]}" -ge 1
          python explorations/radar/screen_sentinel1_reference_areas.py --rasters "${rasters[@]}" --boundary "${boundaries[0]}" --output data/sentinelhub/nairobi/stack/sentinel1_nairobi_reference_area_screen.json

      - name: Upload temporal stack, source rasters, county rasters and QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: sentinelhub-sentinel1-nairobi-temporal-stack
          path: |
            data/sentinelhub/nairobi/stack/*.tif
            data/sentinelhub/nairobi/stack/*.metadata.json
            data/sentinelhub/nairobi/stack/*.quicklook.png
            data/sentinelhub/nairobi/stack/*.qa.json
            data/sentinelhub/nairobi/stack/*.geojson
            data/sentinelhub/nairobi/stack/sentinel1_nairobi_registration_screen.json
            data/sentinelhub/nairobi/stack/sentinel1_nairobi_temporal_qa_screen.json
            data/sentinelhub/nairobi/stack/sentinel1_nairobi_reference_area_screen.json
            data/sentinelhub/nairobi/stack/geometry_aux/*.tif
            data/sentinelhub/nairobi/stack/geometry_aux/*.json
            data/sentinelhub/nairobi/stack/terrain_aux/*.tif
            data/sentinelhub/nairobi/stack/terrain_aux/*.json
          if-no-files-found: error
          retention-days: 14
