name: Photogrammetry ODM package tests

on:
  workflow_dispatch:
  push:
    paths:
      - "implementations/python/photogrammetry-odm/**"
      - ".github/workflows/photogrammetry-odm-tests.yml"
  pull_request:
    paths:
      - "implementations/python/photogrammetry-odm/**"
      - ".github/workflows/photogrammetry-odm-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Photogrammetry ODM unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test runner
        run: python -m pip install "pytest>=8,<10"

      - name: Run package tests
        working-directory: implementations/python/photogrammetry-odm
        run: python -m pytest -q
