name: Sentinel-1 GRD geolocation-grid probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sentinel1-grd-geolocation-grid-probe.yml"
      - "explorations/radar/probe_sentinel1_grd_geolocation_grid.py"
jobs:
  geolocation-grid-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install catalogue and S3 dependencies
        run: |
          python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt
          python -m pip install -r explorations/radar/requirements-sentinel1-s3-metadata.txt
      - name: Verify credentials
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID"
          test -n "$SENTINEL_HUB_CLIENT_SECRET"
          test -n "$CDSE_S3_ACCESS_KEY"
          test -n "$CDSE_S3_SECRET_KEY"
      - name: Inspect one source VV geolocation grid
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          python explorations/radar/probe_sentinel1_grd_geolocation_grid.py \
            --output data/sentinelhub/nairobi/sentinel1_grd_geolocation_grid_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1-grd-geolocation-grid-probe
          path: data/sentinelhub/nairobi/sentinel1_grd_geolocation_grid_probe.json
          if-no-files-found: error
          retention-days: 30
