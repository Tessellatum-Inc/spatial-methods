name: Matched-strata equal-block contrast validation
on:
  push:
    branches: [main]
    paths:
      - "explorations/radar/simulate_matched_strata_equal_block_contrast.py"
      - "explorations/radar/spatial_moving_block_bootstrap.py"
      - "explorations/radar/spatial_hac.py"
      - "explorations/radar/test_spatial_moving_block_bootstrap.py"
      - "explorations/radar/test_spatial_hac.py"
      - "explorations/radar/test_matched_strata_equal_block_contrast.py"
      - ".github/workflows/matched-strata-equal-block-contrast-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  matched-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy
      - name: Run relevant estimator tests
        run: |
          python -m unittest explorations.radar.test_spatial_moving_block_bootstrap -v
          python -m unittest explorations.radar.test_spatial_hac -v
          python -m unittest explorations.radar.test_matched_strata_equal_block_contrast -v
      - name: Run matched-strata equal-block contrast experiment
        run: python -m explorations.radar.simulate_matched_strata_equal_block_contrast > matched-strata-equal-block-contrast.json
      - uses: actions/upload-artifact@v4
        with:
          name: matched-strata-equal-block-contrast
          path: matched-strata-equal-block-contrast.json
          if-no-files-found: error
