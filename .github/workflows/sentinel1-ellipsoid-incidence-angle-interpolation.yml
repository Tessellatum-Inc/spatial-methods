name: Sentinel-1 ellipsoid incidence-angle interpolation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sentinel1-ellipsoid-incidence-angle-interpolation.yml"
      - "explorations/radar/interpolate_sentinel1_ellipsoid_incidence.py"
      - "explorations/radar/compare_sentinel1_same_platform_orbit_pair.py"
permissions:
  actions: read
  contents: read
jobs:
  interpolate-source-incidence-angle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install processing, S3 and interpolation dependencies
        run: |
          python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt
          python -m pip install -r explorations/radar/requirements-sentinel1-s3-metadata.txt
          python -m pip install -r explorations/radar/requirements-sentinel1-incidence-interpolation.txt
      - name: Verify credentials
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID"
          test -n "$SENTINEL_HUB_CLIENT_SECRET"
          test -n "$CDSE_S3_ACCESS_KEY"
          test -n "$CDSE_S3_SECRET_KEY"
      - name: Interpolate source incidence angles onto fixed Nairobi grid
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          python explorations/radar/interpolate_sentinel1_ellipsoid_incidence.py \
            --output-dir data/sentinelhub/nairobi/ellipsoid_incidence \
            --report data/sentinelhub/nairobi/sentinel1_ellipsoid_incidence_grid_qa.json
      - name: Download successful R057 and R130 raster artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 45165182363
          pattern: sentinel1a-ascending-r*-rasters
          path: data/same_platform_rasters
          github-token: ${{ github.token }}
      - name: Compare RTC and ellipsoid backscatter using source ellipsoid incidence angle
        run: |
          python explorations/radar/compare_sentinel1_same_platform_orbit_pair.py \\
            --input-dir data/same_platform_rasters \\
            --incidence-dir data/sentinelhub/nairobi/ellipsoid_incidence \\
            --output data/sentinelhub/nairobi/sentinel1a_same_platform_orbit_pair_ellipsoid_angle_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1a-same-platform-ellipsoid-angle-qa
          path: data/sentinelhub/nairobi/sentinel1a_same_platform_orbit_pair_ellipsoid_angle_qa.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1-ellipsoid-incidence-angle-grids
          path: |
            data/sentinelhub/nairobi/ellipsoid_incidence/
            data/sentinelhub/nairobi/sentinel1_ellipsoid_incidence_grid_qa.json
          if-no-files-found: error
          retention-days: 30
