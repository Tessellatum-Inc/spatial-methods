name: Copernicus Sentinel-1 Nairobi catalogue capture

on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive UTC start timestamp
        required: true
        type: string
        default: "2026-10-01T00:00:00Z"
      end:
        description: Exclusive UTC end timestamp
        required: true
        type: string
        default: "2026-11-22T00:00:00Z"
      limit:
        description: Maximum products to retrieve (1–1000)
        required: true
        type: number
        default: 100
  push:
    branches: [main]
    paths:
      - ".github/workflows/copernicus-sentinel1-catalogue.yml"
      - "explorations/radar/query_copernicus_sentinel1.py"
      - "explorations/radar/audit_copernicus_sentinel1_coverage.py"

permissions:
  contents: read

concurrency:
  group: copernicus-sentinel1-nairobi-catalogue
  cancel-in-progress: false

jobs:
  capture-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Spatial Methods
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Retrieve Copernicus catalogue metadata
        env:
          START: ${{ inputs.start || '2026-10-01T00:00:00Z' }}
          END: ${{ inputs.end || '2026-11-22T00:00:00Z' }}
          LIMIT: ${{ inputs.limit || 100 }}
        run: |
          python explorations/radar/query_copernicus_sentinel1.py \
            --start "$START" \
            --end "$END" \
            --limit "$LIMIT" \
            --output-dir /tmp/copernicus-nairobi

      - name: Install footprint audit dependency
        run: python -m pip install "shapely>=2.0,<3"

      - name: Audit product footprints against the complete study AOI
        run: |
          enriched_file="$(find /tmp/copernicus-nairobi -maxdepth 1 -name '*.with_locations.json' -print -quit)"
          test -n "$enriched_file"
          python explorations/radar/audit_copernicus_sentinel1_coverage.py \
            --input "$enriched_file" \
            --output /tmp/copernicus-nairobi/nairobi-sentinel-1-coverage-audit.json

      - name: Upload raw response and provenance sidecar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copernicus-sentinel1-nairobi-catalogue
          path: /tmp/copernicus-nairobi/
          if-no-files-found: warn
          retention-days: 14
