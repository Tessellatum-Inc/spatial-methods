name: Audit OPERA Nairobi R130 source metadata and raster grids
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-opera-nairobi-r130-assets.yml"
      - "explorations/radar/audit_opera_nairobi_r130_assets.py"
      - "explorations/radar/test_audit_opera_nairobi_r130_assets.py"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # HDF5 + COG inspection across the complete burst/date set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install raster metadata libraries
        run: python -m pip install --disable-pip-version-check h5py rasterio numpy
      - name: Test audit and source-match helpers
        run: |
          python -m unittest explorations.radar.test_audit_opera_nairobi_r130_assets -v
          python -m unittest explorations.radar.test_verify_opera_nairobi_r130_source_match -v
      - name: Download OPERA assets from prior workflow run
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-opera-rtc-science-assets
          path: opera-assets
          run-id: 45345864969
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit HDF5 metadata and raster grids
        run: python explorations/radar/audit_opera_nairobi_r130_assets.py --root opera-assets --output opera-assets-audit.json
      - name: Download Sentinel Hub candidate catalogue report
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-cross-provider-catalogue-matches
          path: candidate-catalogue
          run-id: 45345279164
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify OPERA SLC and Sentinel Hub GRD datatake identity
        run: python explorations/radar/verify_opera_nairobi_r130_source_match.py --audit opera-assets-audit.json --catalogue candidate-catalogue/opera_sentinelhub_candidate_matches.json --output source-datatake-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: nairobi-r130-opera-source-and-raster-audit
          path: |
            opera-assets-audit.json
            source-datatake-verification.json
          if-no-files-found: error
          retention-days: 30
