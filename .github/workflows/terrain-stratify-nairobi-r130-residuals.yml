name: Stratify Nairobi R130 residuals by terrain
on:
  workflow_run:
    workflows: ["Acquire Nairobi R130 Copernicus DEM"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/terrain-stratify-nairobi-r130-residuals.yml"
      - "explorations/radar/terrain_stratify_nairobi_r130_residuals.py"
      - "explorations/radar/test_terrain_stratify_nairobi_r130_residuals.py"
  workflow_dispatch:
    inputs:
      dem_run_id:
        description: Successful Copernicus DEM acquisition run ID
        required: true
        default: "0"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: terrain-stratify-nairobi-r130-residuals
  cancel-in-progress: false
jobs:
  stratify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install raster dependencies
        run: python -m pip install numpy rasterio
      - name: Test terrain derivatives and strata
        run: python -m unittest explorations.radar.test_terrain_stratify_nairobi_r130_residuals -v
      - name: Download residual maps and diagnostic report
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-residual-maps-and-diagnostics
          path: residual-artifact
          run-id: 45360551227
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate residual GeoTIFFs
        run: mkdir residual-maps && cp residual-artifact/residual-maps/*.tif residual-maps/
      - name: Download Copernicus DEM artifact
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-copernicus-dem
          path: dem-assets
          run-id: ${{ github.event.workflow_run.id || inputs.dem_run_id || '45364142134' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate terrain derivatives and residual strata
        run: python explorations/radar/terrain_stratify_nairobi_r130_residuals.py --dem dem-assets/nairobi_copernicus_dem_glo30.tif --residual-dir residual-maps --report terrain-stratification.json
      - uses: actions/upload-artifact@v4
        with:
          name: nairobi-r130-terrain-residual-stratification
          path: terrain-stratification.json
          if-no-files-found: error
          retention-days: 30
