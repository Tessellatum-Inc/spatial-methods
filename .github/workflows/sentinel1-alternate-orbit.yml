name: Sentinel-1 Nairobi alternate-orbit RTC experiment
# Separate, explicitly masked partial-coverage experiment; not the baseline full-AOI stack.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sentinel1-alternate-orbit.yml"
      - "explorations/radar/process_sentinel1_alternate_orbit.py"
  workflow_dispatch:
    inputs:
      direction:
        description: Orbit direction
        required: true
        type: choice
        options: [ascending, descending]
        default: ascending
      relative_orbit:
        description: Relative orbit number
        required: true
        type: number
        default: 130
      min_coverage:
        description: Minimum catalogue AOI intersection fraction
        required: true
        type: number
        default: 0.8
permissions:
  contents: read
jobs:
  alternate-orbit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install processing dependencies
        run: python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt
      - name: Verify OAuth secrets
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID"
          test -n "$SENTINEL_HUB_CLIENT_SECRET"
      - name: Process independent orbit with explicit partial-coverage masks
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: |
          python explorations/radar/process_sentinel1_alternate_orbit.py \
            --direction "${{ inputs.direction || 'ascending' }}" \
            --relative-orbit "${{ inputs.relative_orbit || 130 }}" \
            --min-coverage "${{ inputs.min_coverage || 0.8 }}" \
            --output-dir data/sentinelhub/nairobi/alternate_orbit
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1-nairobi-alternate-orbit-qa
          path: |
            data/sentinelhub/nairobi/alternate_orbit/*.json
            data/sentinelhub/nairobi/alternate_orbit/terrain_aux/*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1-nairobi-alternate-orbit-rasters
          path: |
            data/sentinelhub/nairobi/alternate_orbit/*.tif
            data/sentinelhub/nairobi/alternate_orbit/terrain_aux/*.tif
            data/sentinelhub/nairobi/alternate_orbit/*.metadata.json
          if-no-files-found: error
          retention-days: 14
