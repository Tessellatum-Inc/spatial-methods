name: Paired spatial uncertainty comparison
on:
  push:
    branches: [main]
    paths:
      - "explorations/radar/compare_spatial_uncertainty_methods.py"
      - "explorations/radar/spatial_moving_block_bootstrap.py"
      - "explorations/radar/spatial_hac.py"
      - "explorations/radar/spatial_subsampling.py"
      - ".github/workflows/paired-spatial-uncertainty-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  paired-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy
      - name: Run existing estimator unit tests
        run: |
          python -m unittest explorations.radar.test_spatial_moving_block_bootstrap -v
          python -m unittest explorations.radar.test_spatial_hac -v
          python -m unittest explorations.radar.test_spatial_subsampling -v
      - name: Run paired Monte Carlo comparison
        run: python -m explorations.radar.compare_spatial_uncertainty_methods > paired-spatial-uncertainty-comparison.json
      - uses: actions/upload-artifact@v4
        with:
          name: paired-spatial-uncertainty-comparison
          path: paired-spatial-uncertainty-comparison.json
          if-no-files-found: error
