name: STAC imagery review tests

on:
  push:
    paths:
      - "implementations/python/area-adjusted-accuracy/stac_imagery_review.py"
      - "implementations/python/area-adjusted-accuracy/test_stac_imagery_review.py"
      - "implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt"
      - "implementations/python/area-adjusted-accuracy/multispectral_metrics.py"
      - "implementations/python/area-adjusted-accuracy/test_multispectral_metrics.py"
      - "implementations/python/area-adjusted-accuracy/multispectral_raster.py"
      - "implementations/python/area-adjusted-accuracy/test_multispectral_raster.py"
      - "implementations/python/area-adjusted-accuracy/fiji_multispectral_pilot.py"
      - "implementations/python/area-adjusted-accuracy/test_fiji_multispectral_pilot.py"
      - "implementations/python/area-adjusted-accuracy/prepare_fiji_blind_review.py"
      - "implementations/python/area-adjusted-accuracy/test_prepare_fiji_blind_review.py"
      - ".github/workflows/stac-imagery-review-tests.yml"
  pull_request:
    paths:
      - "implementations/python/area-adjusted-accuracy/stac_imagery_review.py"
      - "implementations/python/area-adjusted-accuracy/test_stac_imagery_review.py"
      - "implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt"
      - "implementations/python/area-adjusted-accuracy/multispectral_metrics.py"
      - "implementations/python/area-adjusted-accuracy/test_multispectral_metrics.py"
      - "implementations/python/area-adjusted-accuracy/multispectral_raster.py"
      - "implementations/python/area-adjusted-accuracy/test_multispectral_raster.py"
      - "implementations/python/area-adjusted-accuracy/fiji_multispectral_pilot.py"
      - "implementations/python/area-adjusted-accuracy/test_fiji_multispectral_pilot.py"
      - ".github/workflows/stac-imagery-review-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run unit tests
        run: python -m unittest -v test_stac_imagery_review.py
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run multispectral numerical tests
        run: python -m unittest -v test_multispectral_metrics.py
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run multispectral raster tests
        run: python -m unittest -v test_multispectral_raster.py
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run Fiji multispectral pilot orchestration tests
        run: python -m unittest -v test_fiji_multispectral_pilot.py
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run Fiji blind-review preparation tests
        run: python -m unittest -v test_prepare_fiji_blind_review.py
        working-directory: implementations/python/area-adjusted-accuracy

  catalogue-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAC_REQUEST_TIMEOUT: 15
      STAC_MAX_PAGES: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Select five geographically dispersed blind points
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path
          source = Path("data/fiji-worldcover-legend-adjudication-blind-review.csv")
          with source.open(newline="", encoding="utf-8-sig") as stream:
              rows = list(csv.DictReader(stream))
          if not rows:
              raise SystemExit("No blind review points found")
          def unit_vector(row):
              lon, lat = math.radians(float(row["longitude"])), math.radians(float(row["latitude"]))
              return (math.cos(lat) * math.cos(lon), math.cos(lat) * math.sin(lon), math.sin(lat))
          vectors = [unit_vector(row) for row in rows]
          chosen = [0]
          while len(chosen) < min(5, len(rows)):
              remaining = []
              for i, vector in enumerate(vectors):
                  if i in chosen:
                      continue
                  nearest = min(
                      math.acos(max(-1.0, min(1.0, sum(a*b for a, b in zip(vector, vectors[j])))))
                      for j in chosen
                  )
                  remaining.append((nearest, i))
              chosen.append(max(remaining)[1])
          sample = [rows[i] for i in chosen]
          target = Path("/tmp/fiji-stac-smoke-input.csv")
          with target.open("w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=list(sample[0]))
              writer.writeheader()
              writer.writerows(sample)
          print(f"Selected {len(sample)} maximin points on the sphere")
          PY
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Query public STAC catalogues (metadata only)
        id: discovery
        continue-on-error: true
        run: |
          mkdir -p /tmp/fiji-stac-smoke
          set +e
          python stac_imagery_review.py \
            --input /tmp/fiji-stac-smoke-input.csv \
            --output-dir /tmp/fiji-stac-smoke \
            --metadata-only
          code=$?
          echo "cli_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Upload catalogue discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-stac-catalogue-smoke-test
          path: /tmp/fiji-stac-smoke/
          if-no-files-found: warn
          retention-days: 7

  public-cog-window-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAC_REQUEST_TIMEOUT: 20
      STAC_MAX_PAGES: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Select one point on each side of the antimeridian
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          source = Path("data/fiji-worldcover-legend-adjudication-blind-review.csv")
          with source.open(newline="", encoding="utf-8-sig") as stream:
              rows = list(csv.DictReader(stream))
          east = next((r for r in rows if float(r["longitude"]) > 0), None)
          west = next((r for r in rows if float(r["longitude"]) < 0), None)
          if east is None or west is None:
              raise SystemExit("Blind review input must include points on both sides of the antimeridian")
          sample = [east, west]
          target = Path("/tmp/fiji-cog-smoke-input.csv")
          with target.open("w", newline="", encoding="utf-8") as stream:
              writer = csv.DictWriter(stream, fieldnames=list(sample[0]))
              writer.writeheader()
              writer.writerows(sample)
          print("Selected east and west Fiji points")
          PY
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Read small public Earth Search COG windows
        run: |
          python stac_imagery_review.py \
            --input /tmp/fiji-cog-smoke-input.csv \
            --output-dir /tmp/fiji-cog-smoke \
            --catalogues earth-search \
            --limit-per-point 1 \
            --keep-chips
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("/tmp/fiji-cog-smoke/stac-imagery-provenance.csv")
          if not path.exists():
              raise SystemExit("No STAC provenance report was produced")
          with path.open(newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          created = [row for row in rows if row.get("status") == "chip_created"]
          print(f"Candidate rows: {len(rows)}; successful window reads: {len(created)}")
          summary = Path("/tmp/fiji-cog-smoke-summary.md")
          with summary.open("w", encoding="utf-8") as report:
              report.write("## Fiji public COG window smoke test\\n\\n")
              report.write(f"Candidate rows: {len(rows)}; successful window reads: {len(created)}\\n\\n")
              report.write("| Sample | Catalogue | Item | Acquired | Cloud % | Status | Chip SHA-256 | Notes |\\n")
              report.write("|---|---|---|---|---:|---|---|---|\\n")
              for row in rows:
                  report.write(
                      f"| {row.get('sample_id','')} | {row.get('catalogue','')} | "
                      f"{row.get('item_id','')} | {row.get('datetime','')} | "
                      f"{row.get('cloud_cover_percent','')} | {row.get('status','')} | "
                      f"{row.get('chip_sha256','')} | {row.get('notes','')} |\\n"
                  )
          with open("/tmp/fiji-cog-smoke-summary.md", encoding="utf-8") as report:
              content = report.read()
          print(content)
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as target:
              target.write(content)
          if not created:
              raise SystemExit("No public COG window read succeeded")
          PY
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Upload chip and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-public-cog-window-smoke-test
          path: /tmp/fiji-cog-smoke/
          if-no-files-found: warn
          retention-days: 7

  full-pilot-public-cog-chip-retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAC_REQUEST_TIMEOUT: 30
      STAC_MAX_PAGES: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Read up to three public Earth Search candidates per blind-review point
        run: |
          mkdir -p /tmp/fiji-full-public-cog
          set +e
          python stac_imagery_review.py \
            --input data/fiji-worldcover-legend-adjudication-blind-review.csv \
            --output-dir /tmp/fiji-full-public-cog \
            --catalogues earth-search \
            --limit-per-point 3 \
            --keep-chips
          code=$?
          echo "cli_exit_code=$code" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Summarise chip retrieval coverage
        if: always()
        run: |
          python - <<'PY'
          import csv
          import os
          from collections import Counter, defaultdict
          from pathlib import Path
          path = Path("/tmp/fiji-full-public-cog/stac-imagery-provenance.csv")
          if not path.exists():
              raise SystemExit("No provenance CSV was produced")
          with path.open(newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          statuses = Counter(row.get("status", "") for row in rows)
          points = defaultdict(list)
          for row in rows:
              points[row.get("sample_id", "")].append(row)
          lines = [
              "## Fiji full-pilot public COG retrieval\n\n",
              f"- Points represented: {len(points)}\n",
              f"- Candidate/window attempts: {len(rows)}\n",
              f"- Statuses: {dict(statuses)}\n",
              f"- Points with at least one chip: {sum(any(r.get('status') in ('chip_created','chip_created_then_deleted') for r in rs) for rs in points.values())}\n\n",
              "| Sample | Attempts | Chips created | Best successful date | Best successful cloud % |\n",
              "|---|---:|---:|---|---:|\n",
          ]
          for sample_id, candidates in sorted(points.items()):
              good = [r for r in candidates if r.get("status") in ("chip_created", "chip_created_then_deleted")]
              best = min(good, key=lambda r: float(r.get("cloud_cover_percent") or 100)) if good else {}
              lines.append(
                  f"| {sample_id} | {len(candidates)} | {len(good)} | "
                  f"{best.get('datetime','')} | {best.get('cloud_cover_percent','')} |\n"
              )
          report_text = "".join(lines)
          print(report_text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(report_text)
          PY
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Upload full-pilot RGB chips and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-full-25-point-public-cog-chips
          path: /tmp/fiji-full-public-cog/
          if-no-files-found: warn
          retention-days: 14

  full-pilot-catalogue-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      STAC_REQUEST_TIMEOUT: 20
      STAC_MAX_PAGES: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Discover 2021 imagery for all 25 blind-review points
        continue-on-error: true
        run: |
          python stac_imagery_review.py \
            --input data/fiji-worldcover-legend-adjudication-blind-review.csv \
            --output-dir /tmp/fiji-full-pilot-discovery \
            --catalogues both \
            --limit-per-point 3 \
            --metadata-only
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Summarise catalogue coverage
        if: always()
        run: |
          python - <<'PY'
          import csv
          import os
          from collections import Counter
          from pathlib import Path
          path = Path("/tmp/fiji-full-pilot-discovery/stac-imagery-provenance.csv")
          if not path.exists():
              raise SystemExit("No provenance CSV was produced")
          with path.open(newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          statuses = Counter(row.get("status", "") for row in rows)
          catalogues = Counter(row.get("catalogue", "") for row in rows)
          points = {row.get("sample_id") for row in rows}
          grouped = {}
          for row in rows:
              grouped.setdefault((row.get("sample_id", ""), row.get("catalogue", "")), []).append(row)
          lines = [
              "## Full 25-point Fiji STAC discovery\\n\\n",
              f"- Points represented: {len(points)}\\n",
              f"- Candidate/status rows: {len(rows)}\\n",
              f"- Statuses: {dict(statuses)}\\n",
              f"- Catalogue rows: {dict(catalogues)}\\n\\n",
              "| Sample | Catalogue | Best item | Acquisition | Cloud % | Status |\\n",
              "|---|---|---|---|---:|---|\\n",
          ]
          for (sample_id, catalogue), candidates in sorted(grouped.items()):
              def cloud(row):
                  try:
                      return float(row.get("cloud_cover_percent") or 100)
                  except ValueError:
                      return 100.0
              best = min(candidates, key=cloud)
              lines.append(
                  f"| {sample_id} | {catalogue} | {best.get('item_id','')} | "
                  f"{best.get('datetime','')} | {best.get('cloud_cover_percent','')} | "
                  f"{best.get('status','')} |\\n"
              )
          report_text = "".join(lines)
          print(report_text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write(report_text)
          PY
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Upload full pilot discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-full-25-point-stac-discovery
          path: /tmp/fiji-full-pilot-discovery/
          if-no-files-found: warn
          retention-days: 14

  fiji-five-point-multispectral-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAC_REQUEST_TIMEOUT: 30
      STAC_MAX_PAGES: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run bounded five-point public multispectral pilot
        run: |
          python fiji_multispectral_pilot.py \
            --input data/fiji-worldcover-legend-adjudication-blind-review.csv \
            --output-dir /tmp/fiji-multispectral-pilot \
            --points 5 \
            --items-per-point 3 \
            --window-pixels 16
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Upload multispectral provenance and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-five-point-multispectral-pilot
          path: /tmp/fiji-multispectral-pilot/
          if-no-files-found: warn
          retention-days: 7

  fiji-25-point-multispectral-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STAC_REQUEST_TIMEOUT: 30
      STAC_MAX_PAGES: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-stac-imagery.txt
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Run bounded 25-point public multispectral extraction
        run: |
          python fiji_multispectral_pilot.py \
            --input data/fiji-worldcover-legend-adjudication-blind-review.csv \
            --output-dir /tmp/fiji-25-point-multispectral \
            --points 25 \
            --items-per-point 3 \
            --window-pixels 16
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Summarise 25-point multispectral coverage
        if: always()
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from collections import Counter, defaultdict
          from pathlib import Path
          path = Path("/tmp/fiji-25-point-multispectral/fiji-multispectral-pilot.csv")
          if not path.exists():
              raise SystemExit("No multispectral provenance CSV was produced")
          with path.open(newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          by_point = defaultdict(list)
          for row in rows:
              by_point[row["sample_id"]].append(row)
          statuses = Counter(row["status"] for row in rows)
          covered = sum(any(r["status"] == "core_bands_read" for r in group) for group in by_point.values())
          lines = [
              "## Fiji 25-point multispectral extraction\n\n",
              f"- Points represented: {len(by_point)}\n",
              f"- Candidate reads: {len(rows)}\n",
              f"- Statuses: {dict(statuses)}\n",
              f"- Points with at least one complete B02/B03/B04/B08 read: {covered}\n\n",
              "| Sample | Candidate reads | Core-band reads | Best successful acquisition | Missing-band observations |\n",
              "|---|---:|---:|---|---|\n",
          ]
          for sample_id, group in sorted(by_point.items()):
              core = [r for r in group if r["status"] == "core_bands_read"]
              dates = sorted({r["datetime"][:10] for r in core if r.get("datetime")})
              missing = sorted({band for r in group for band in json.loads(r.get("missing_bands") or "[]")})
              lines.append(f"| {sample_id} | {len(group)} | {len(core)} | {', '.join(dates)} | {', '.join(missing)} |\n")
          report = "".join(lines)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as target:
              target.write(report)
          if covered != len(by_point):
              raise SystemExit(f"Core-band coverage incomplete: {covered}/{len(by_point)} points")
          PY
        working-directory: implementations/python/area-adjusted-accuracy
      - name: Upload 25-point multispectral provenance and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiji-25-point-multispectral-pilot
          path: /tmp/fiji-25-point-multispectral/
          if-no-files-found: warn
          retention-days: 14
