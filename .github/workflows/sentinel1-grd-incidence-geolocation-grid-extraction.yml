name: Sentinel-1 GRD incidence geolocation-grid extraction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sentinel1-grd-incidence-geolocation-grid-extraction.yml"
      - "explorations/radar/extract_sentinel1_grd_incidence_grids.py"
jobs:
  extract-geolocation-grids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install catalogue and S3 dependencies
        run: |
          python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt
          python -m pip install -r explorations/radar/requirements-sentinel1-s3-metadata.txt
      - name: Verify credentials
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID"
          test -n "$SENTINEL_HUB_CLIENT_SECRET"
          test -n "$CDSE_S3_ACCESS_KEY"
          test -n "$CDSE_S3_SECRET_KEY"
      - name: Extract eight VV geolocation grids
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          python explorations/radar/extract_sentinel1_grd_incidence_grids.py \
            --output data/sentinelhub/nairobi/sentinel1_grd_incidence_geolocation_grids.json
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1-grd-incidence-geolocation-grids
          path: data/sentinelhub/nairobi/sentinel1_grd_incidence_geolocation_grids.json
          if-no-files-found: error
          retention-days: 30
