name: Sentinel-1 GRD calibration LUT incidence-angle validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sentinel1-grd-calibration-lut-incidence-validation.yml"
      - "explorations/radar/probe_sentinel1_grd_calibration_lut.py"
jobs:
  calibration-lut-incidence-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install catalogue and S3 dependencies
        run: |
          python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt
          python -m pip install -r explorations/radar/requirements-sentinel1-s3-metadata.txt
          python -m pip install -r explorations/radar/requirements-sentinel1-incidence-interpolation.txt
      - name: Verify credentials
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID"
          test -n "$SENTINEL_HUB_CLIENT_SECRET"
          test -n "$CDSE_S3_ACCESS_KEY"
          test -n "$CDSE_S3_SECRET_KEY"
      - name: Extract and verify calibration LUT incidence angles
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          python explorations/radar/probe_sentinel1_grd_calibration_lut.py \
            --output data/sentinelhub/nairobi/sentinel1_grd_calibration_lut_incidence_qa.json
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel1-grd-calibration-lut-incidence-qa
          path: data/sentinelhub/nairobi/sentinel1_grd_calibration_lut_incidence_qa.json
          if-no-files-found: error
          retention-days: 30
