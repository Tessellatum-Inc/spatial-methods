name: Validate spatial block bootstrap primitives
on:
  push:
    branches: [main]
    paths:
      - "explorations/radar/spatial_block_bootstrap.py"
      - "explorations/radar/test_spatial_block_bootstrap.py"
      - "explorations/radar/test_matched_spatial_block_contrasts.py"
      - ".github/workflows/test-spatial-block-bootstrap.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy
      - run: python -m unittest explorations.radar.test_spatial_block_bootstrap explorations.radar.test_matched_spatial_block_contrasts -v
