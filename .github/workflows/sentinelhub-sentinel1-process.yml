name: Sentinel Hub Sentinel-1 Nairobi raster sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinelhub-sentinel1-process
  cancel-in-progress: false

jobs:
  process-sample:
    name: Process and quality-check latest Nairobi Sentinel-1 GRD scene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install raster QA dependencies
        run: python -m pip install -r explorations/radar/requirements-sentinelhub-processing.txt

      - name: Verify OAuth secrets are configured
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID" || { echo "::error::Missing SENTINEL_HUB_CLIENT_ID repository secret"; exit 1; }
          test -n "$SENTINEL_HUB_CLIENT_SECRET" || { echo "::error::Missing SENTINEL_HUB_CLIENT_SECRET repository secret"; exit 1; }
          echo "Both Sentinel Hub OAuth secrets are configured."

      - name: Request one acquisition as VV/VH GeoTIFF
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: python explorations/radar/process_sentinelhub_sentinel1.py --limit 100

      - name: Inspect rectangular raster coverage and backscatter values
        run: |
          raster="$(find data/sentinelhub/nairobi -maxdepth 1 -type f -name '*.tif' -print -quit)"
          test -n "$raster" || { echo "::error::No GeoTIFF was produced"; exit 1; }
          python explorations/radar/inspect_sentinelhub_sentinel1.py "$raster"

      - name: Retrieve Nairobi County boundary and create county-masked raster
        run: |
          raster="$(find data/sentinelhub/nairobi -maxdepth 1 -type f -name '*.tif' ! -name '*_county_*' -print -quit)"
          test -n "$raster" || { echo "::error::No source GeoTIFF was produced"; exit 1; }
          python explorations/radar/mask_sentinelhub_sentinel1_nairobi_county.py "$raster"

      - name: Upload source, county raster, boundary, quicklooks and QA reports
        uses: actions/upload-artifact@v4
        with:
          name: sentinelhub-sentinel1-nairobi-county-product
          path: |
            data/sentinelhub/nairobi/*.tif
            data/sentinelhub/nairobi/*.metadata.json
            data/sentinelhub/nairobi/*.quicklook.png
            data/sentinelhub/nairobi/*.qa.json
            data/sentinelhub/nairobi/*.geojson
          if-no-files-found: error
          retention-days: 14
