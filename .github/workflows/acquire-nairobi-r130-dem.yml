name: Acquire Nairobi R130 Copernicus DEM
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/acquire-nairobi-r130-dem.yml"
      - "explorations/radar/acquire_nairobi_r130_copernicus_dem.py"
permissions:
  contents: read
concurrency:
  group: acquire-nairobi-r130-dem
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install raster dependencies
        run: python -m pip install numpy rasterio
      - name: Verify Sentinel Hub credentials
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: |
          test -n "$SENTINEL_HUB_CLIENT_ID"
          test -n "$SENTINEL_HUB_CLIENT_SECRET"
      - name: Download Copernicus GLO-30 DEM for study extent
        env:
          SENTINEL_HUB_CLIENT_ID: ${{ secrets.SENTINEL_HUB_CLIENT_ID }}
          SENTINEL_HUB_CLIENT_SECRET: ${{ secrets.SENTINEL_HUB_CLIENT_SECRET }}
        run: python explorations/radar/acquire_nairobi_r130_copernicus_dem.py --timeout 300
      - uses: actions/upload-artifact@v4
        with:
          name: nairobi-r130-copernicus-dem
          path: dem-assets/
          if-no-files-found: error
          retention-days: 30
