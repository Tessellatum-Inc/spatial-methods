name: Jointly stratify Nairobi R130 residuals by land cover, terrain and ANF
on:
  workflow_dispatch:
    inputs:
      residual_run_id:
        description: Successful residual-map workflow run ID
        required: true
        default: "45360551227"
        type: string
      opera_run_id:
        description: Successful OPERA RTC assets workflow run ID
        required: true
        default: "45345864969"
        type: string
      dynamic_world_run_id:
        description: Successful Dynamic World acquisition workflow run ID
        required: true
        default: "45400510881"
        type: string
      dem_run_id:
        description: Successful Copernicus DEM workflow run ID
        required: true
        default: "45364142134"
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: joint-nairobi-r130-landcover-terrain-anf
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install raster analysis dependencies
        run: python -m pip install numpy rasterio pyproj
      - name: Test date handling, metric slope and summaries
        run: python -m unittest explorations.radar.test_joint_stratify_nairobi_r130_landcover_terrain_anf -v
      - name: Download residual maps
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-residual-maps-and-diagnostics
          path: residual-artifact
          run-id: ${{ inputs.residual_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate residual GeoTIFFs
        run: mkdir residual-maps && cp residual-artifact/residual-maps/*.tif residual-maps/
      - name: Download OPERA RTC and RTC-STATIC assets
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-opera-rtc-science-assets
          path: opera-assets
          run-id: ${{ inputs.opera_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Dynamic World composites
        uses: actions/download-artifact@v4
        with:
          name: nairobi-r130-dynamic-world-date-window-composites
          path: dynamic-world-assets
          run-id: ${{ inputs.dynamic_world_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download Copernicus DEM
        uses: actions/download-artifact@v4
        with:
          name: nairoi-r130-copernicus-dem
          path: dem-assets
          run-id: ${{ inputs.dem_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate DEM artifact filename
        run: test -f dem-assets/nairobi_copernicus_dem_glo30.tif
      - name: Run within-scene matched stratification
        run: |
          python explorations/radar/joint_stratify_nairobi_r130_landcover_terrain_anf.py \
            --residual-dir residual-maps --opera-dir opera-assets \
            --dynamic-world-dir dynamic-world-assets \
            --dem dem-assets/nairobi_copernicus_dem_glo30.tif \
            --output joint-landcover-terrain-anf.json
      - uses: actions/upload-artifact@v4
        with:
          name: nairobi-r130-joint-landcover-terrain-anf
          path: joint-landcover-terrain-anf.json
          if-no-files-found: error
          retention-days: 30
