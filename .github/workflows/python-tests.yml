    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

