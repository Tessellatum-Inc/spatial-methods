name: Python examples

# Keep the package matrix and explicit notebook execution list in sync with the public learning catalogue.

concurrency:
  group: spatial-analysis-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
