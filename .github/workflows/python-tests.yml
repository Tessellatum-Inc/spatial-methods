name: Python examples

# Keep the package matrix and explicit notebook execution list in sync with the public learning catalogue.

concurrency:
  group: spatial-analysis-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include:
          - example: raster-reclassification
            directory: implementations/python/raster-reclassification
            pythonpath: ""
          - example: routing-heuristics
            directory: implementations/python/routing-heuristics
