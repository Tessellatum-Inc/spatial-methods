name: Fiji STAC imagery unit tests

on:
  workflow_dispatch:
  push:
    paths:
      - "implementations/python/area-adjusted-accuracy/stac_imagery_review.py"
      - "implementations/python/area-adjusted-accuracy/test_stac_imagery_review.py"
      - "implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt"
      - ".github/workflows/fiji-stac-imagery-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r implementations/python/area-adjusted-accuracy/requirements-stac-imagery.txt
      - name: Run STAC helper tests
        working-directory: implementations/python/area-adjusted-accuracy
        run: python -m unittest -v test_stac_imagery_review.py
