name: CEOS Surat Basin corner-reflector inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ceos-surat-basin-corner-reflector-inventory.yml"
      - "explorations/radar/inventory_ceos_surat_corner_reflectors.py"
jobs:
  inventory-surat-corner-reflectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Retrieve and validate CEOS target coordinates
        run: |
          python explorations/radar/inventory_ceos_surat_corner_reflectors.py \
            --output data/sentinelhub/surat_basin/ceos_surat_basin_corner_reflectors.json
      - uses: actions/upload-artifact@v4
        with:
          name: ceos-surat-basin-corner-reflectors
          path: data/sentinelhub/surat_basin/ceos_surat_basin_corner_reflectors.json
          if-no-files-found: error
          retention-days: 30
